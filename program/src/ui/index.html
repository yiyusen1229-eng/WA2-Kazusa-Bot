<script>
/* __hashRoute: 用 #opt / #save / #model 直接打开界面(调试/对比用) */
window.addEventListener("load", function () {
  var h = (location.hash || "").replace("#", "");
  if (!h) return;
  setTimeout(function () {
    try { window.__endIntro && window.__endIntro(); } catch (e) {}
    var st = document.querySelector('[data-act="start"]');
    if (st) { try { st.click(); } catch (e) {} }
    setTimeout(function () {
      if (h === "model" && window.__openModel) window.__openModel();
      else if (window.__openScreen) window.__openScreen(h);
    }, 700);
  }, 900);
});
</script>
